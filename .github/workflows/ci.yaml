name: CI

# Runs on pushes to master (direct pushes and PR merge commits alike) and on
# any pull request targeting master.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

# A newer commit on the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies (package and example)
        run: |
          flutter pub get
          flutter pub get --directory=example

      # 1. Formatting: any deviation from the formatter fails the build.
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      # 2. Static analysis: package and example must both be clean.
      - name: Analyze
        run: flutter analyze lib test example/lib

      # 3. Unit and widget tests with coverage.
      - name: Run tests
        run: flutter test --coverage

      # 4. Coverage thresholds: 80% overall, 90% for the logic core.
      - name: Enforce coverage thresholds
        run: |
          total=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} \
            END{printf "%.1f", lh*100/lf}' coverage/lcov.info)
          ctrl=$(awk '/^SF:.*controller/{f=1} /^SF:/{if($0 !~ /controller/) f=0} \
            f&&/^LF:/{lf+=substr($0,4)} f&&/^LH:/{lh+=substr($0,4)} \
            END{printf "%.1f", lh*100/lf}' coverage/lcov.info)
          echo "Overall line coverage: ${total}% (threshold 80%)"
          echo "controller/ coverage: ${ctrl}% (threshold 90%)"
          awk -v v="$total" 'BEGIN { exit (v >= 80) ? 0 : 1 }' \
            || { echo "::error::Overall coverage is below 80%"; exit 1; }
          awk -v v="$ctrl" 'BEGIN { exit (v >= 90) ? 0 : 1 }' \
            || { echo "::error::controller/ coverage is below 90%"; exit 1; }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
